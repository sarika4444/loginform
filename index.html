<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Sign in · Northstar</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17243a; background: #f4f7fb; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 18px; background: radial-gradient(ellipse at 12% 12%, #e3edff 0, transparent 38%), radial-gradient(ellipse at 92% 90%, #e6f6f1 0, transparent 34%), #f7f9fc; }
    .shell { width: min(100%, 440px); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto 22px; color: #17243a; font-size: 16px; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: white; background: linear-gradient(145deg, #5379ef, #3159cc); box-shadow: 0 5px 12px #365fd644; }
    .brand-mark svg { width: 19px; height: 19px; }
    .card { padding: 38px 40px 32px; border: 1px solid #e5eaf2; border-radius: 18px; background: #fff; box-shadow: 0 18px 55px #1c355410, 0 2px 8px #1c355408; }
    h1 { margin: 0; text-align: center; font-size: 27px; line-height: 1.25; letter-spacing: -.04em; }
    .intro { margin: 9px 0 29px; color: #728098; text-align: center; font-size: 14px; line-height: 1.55; }
    .field { margin-top: 18px; }
    label { display: block; margin-bottom: 8px; color: #34435a; font-size: 13px; font-weight: 650; }
    .input-wrap { position: relative; }
    input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #dce3ee; border-radius: 9px; outline: none; background: #fff; color: #17243a; font: inherit; font-size: 14px; transition: border-color .18s, box-shadow .18s; }
    input::placeholder { color: #a3adbd; }
    input:focus { border-color: #5278e9; box-shadow: 0 0 0 3px #5278e91c; }
    .password-input { padding-right: 54px; }
    .toggle { position: absolute; top: 50%; right: 11px; transform: translateY(-50%); padding: 5px; border: 0; background: transparent; color: #718099; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
    .toggle:hover { color: #365fcf; }
    .submit { width: 100%; height: 48px; margin-top: 25px; border: 0; border-radius: 9px; background: #4168df; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 12px #4168df30; transition: background .18s, transform .18s, box-shadow .18s; }
    .submit:hover { transform: translateY(-1px); background: #3158cb; box-shadow: 0 7px 16px #4168df3c; }
    .submit:focus-visible, .toggle:focus-visible { outline: 3px solid #96acff; outline-offset: 3px; }
    .message { min-height: 21px; margin: 15px 0 0; text-align: center; font-size: 13px; font-weight: 650; }
    .message[data-state="success"] { color: #15805a; }
    .message[data-state="error"] { color: #c13d4c; }
    .demo { margin: 22px 0 0; padding: 12px 14px; border: 1px solid #e7edf8; border-radius: 9px; background: #f7f9fd; color: #748199; text-align: center; font-size: 12px; line-height: 1.6; }
    .demo strong { color: #4b5b75; font-weight: 650; }
    footer { margin-top: 18px; color: #9aa5b5; text-align: center; font-size: 12px; }
    @media (max-width: 480px) { .card { padding: 32px 24px 26px; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="Northstar">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.8 14.4 9.6 21.2 12l-6.8 2.4L12 21.2l-2.4-6.8L2.8 12l6.8-2.4L12 2.8Z" fill="currentColor"/><circle cx="12" cy="12" r="2.1" fill="#4168df"/></svg></span>
      Northstar
    </div>
    <section class="card" aria-labelledby="heading">
      <h1 id="heading">Welcome back</h1>
      <p class="intro">Sign in to continue to your workspace.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" aria-describedby="message" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="password-input" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" aria-describedby="message" required>
            <button class="toggle" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <button class="submit" type="submit">Sign in</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
      <p class="demo"><strong>Demo account</strong><br>Username: admin &nbsp;·&nbsp; Password: 12345</p>
    </section>
    <footer>Login form demo · Credentials are checked in your browser</footer>
  </main>
  <script>
    (() => {
      const form = document.getElementById('login-form');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const message = document.getElementById('message');
      const toggle = document.getElementById('toggle-password');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const userValue = username.value.trim();
        const passwordValue = password.value;
        let text;
        let state;

        if (!userValue || !passwordValue) {
          text = 'Please enter username and password';
          state = 'error';
        } else if (userValue === 'admin' && passwordValue === '12345') {
          text = 'Login Successful!';
          state = 'success';
        } else {
          text = 'Invalid Username or Password';
          state = 'error';
        }

        message.textContent = text;
        message.dataset.state = state;
      });

      toggle.addEventListener('click', () => {
        const showing = password.type === 'password';
        password.type = showing ? 'text' : 'password';
        toggle.textContent = showing ? 'Hide' : 'Show';
        toggle.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
        toggle.setAttribute('aria-pressed', String(showing));
      });
    })();
  </script>
</body>
</html>
